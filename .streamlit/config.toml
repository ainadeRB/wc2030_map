[theme]
primaryColor = "#056432"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f4f2ee"
textColor = "#1a1a1a"
font = "sans serif"

# Barre latérale (filtres, carte, données) : vert foncé de marque, distinct
# du reste de l'app — pris en charge depuis Streamlit 1.4x via [theme.sidebar],
# sans affecter le fond de la zone principale (carte, tableau...).
# primaryColor en rouge plutôt qu'en blanc : une case cochée (remplie avec
# primaryColor) doit nettement se distinguer d'une case vide (blanche) —
# du blanc sur blanc ne se voyait quasiment pas.
[theme.sidebar]
backgroundColor = "#056432"
secondaryBackgroundColor = "#0B7A3D"
primaryColor = "#CC1D33"
textColor = "#ffffff"

[server]
headless = true
